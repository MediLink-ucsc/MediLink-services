name: MediLink

services:
  postgres:
    image: bitnami/postgresql:17.4.0
    container_name: postgres
    environment:
      POSTGRESQL_USERNAME: admin
      POSTGRESQL_PASSWORD: medilink
      POSTGRESQL_DATABASE: medilink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medilink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d medilink"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack:6.2.6-v19
    container_name: redis
    environment:
      REDIS_ARGS: "--requirepass medilink"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    networks:
      - medilink-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.9.0
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_KRAFT_CLUSTER_ID=CLUSTER_ID_1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - medilink-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=localCluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - medilink-network
    restart: unless-stopped

  medilink-api-gateway:
    image: medilink/api-gateway:latest
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    env_file:
      - services/api-gateway/.env.production
    environment:
      - NODE_ENV=test
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medilink-network
    restart: unless-stopped

  medilink-auth-service:
    image: medilink/auth-service:latest
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    env_file:
      - services/auth-service/.env.production
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      medilink-api-gateway:
        condition: service_started
    networks:
      - medilink-network
    restart: unless-stopped

  medilink-lab-report-service:
    image: medilink/lab-report-service:latest
    build:
      context: .
      dockerfile: services/lab-report-service/Dockerfile
    container_name: lab-report-service
    ports:
      - "3004:3004"
    env_file:
      - services/lab-report-service/.env.production
    environment:
      - NODE_ENV=production
      - TESSERACT_PATH=/usr/bin/tesseract
      - POPPLER_PATH=/usr/bin
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_BROKER=kafka:9092
      - DATABASE_URL=postgresql://admin:medilink@postgres:5432/medilink
      - REDIS_URL=redis://:medilink@redis:6379
    volumes:
      - ./services/lab-report-service/uploads:/workspace/services/lab-report-service/uploads
      - lab_reports_data:/workspace/services/lab-report-service/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      medilink-api-gateway:
        condition: service_started
    networks:
      - medilink-network
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:3004/api/v1/labReport/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "3005:3005"
    env_file:
      - services/notification-service/.env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://admin:medilink@postgres:5432/medilink
      - REDIS_URL=redis://:medilink@redis:6379
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - medilink-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  kafka_data:
  lab_reports_data:

networks:
  medilink-network:
    driver: bridge
